<header>
  <div class="brand-block">
    <a class="brand-link" routerLink="/" aria-label="True Altitude home">
      <img [src]="logoUrl" alt="True Altitude logo" />
    </a>

    <h1>{{ greeting }}</h1>
  </div>

  <div class="header-actions">
    <button type="button" class="theme-btn" (click)="toggleTheme()" [attr.aria-pressed]="isDarkMode()">
      <i class="fas" [class.fa-moon]="!isDarkMode()" [class.fa-sun]="isDarkMode()" aria-hidden="true"></i>
      <span>{{ isDarkMode() ? 'Dark' : 'Light' }} Mode</span>
    </button>

    @if (isLoggedIn()) {
      <div class="user-profile">
        <img [src]="getDisplayAvatar()" [alt]="getDisplayName() + ' avatar'" />
        <span>{{ getDisplayName() }}</span>
      </div>
      <button type="button" class="logout-btn" (click)="onLogout()">Logout</button>
    } @else {
      <a class="login-btn" routerLink="/login">Login</a>
    }
  </div>
</header>
