<header>
  <div class="brand-block">
    <a class="brand-link" routerLink="/" aria-label="True Altitude home">
      <img [src]="logoUrl" alt="True Altitude logo" />
    </a>

    <h1>{{ greeting }}</h1>
  </div>

  <div class="header-actions">
    <button type="button" class="theme-btn" (click)="toggleTheme()" [attr.aria-pressed]="isDarkMode()">
      <i class="fas" [class.fa-moon]="!isDarkMode()" [class.fa-sun]="isDarkMode()" aria-hidden="true"></i>
      <span>{{ isDarkMode() ? 'Dark' : 'Light' }} Mode</span>
    </button>

    @if (isLoggedIn()) {
      <div class="profile-menu">
        <button
          type="button"
          class="user-profile"
          (click)="toggleProfileMenu()"
          [attr.aria-expanded]="isProfileMenuOpen"
          aria-haspopup="menu"
          aria-label="Open profile menu"
        >
          <img [src]="getDisplayAvatar()" [alt]="getDisplayName() + ' avatar'" (error)="onAvatarError($event)" />
          <span>{{ getDisplayName() }}</span>
          <i class="fas fa-chevron-down" aria-hidden="true"></i>
        </button>

        @if (isProfileMenuOpen) {
          <div class="profile-dropdown" role="menu" aria-label="Profile actions">
            <div class="profile-dropdown__meta">
              <strong>{{ getDisplayName() }}</strong>
              <span>Signed in</span>
            </div>
            <button type="button" class="profile-dropdown__logout" (click)="onLogout()" role="menuitem">
              <i class="fas fa-sign-out-alt" aria-hidden="true"></i>
              Logout
            </button>
          </div>
        }
      </div>
    } @else {
      <a class="login-btn" routerLink="/login">Login</a>
    }
  </div>
</header>
