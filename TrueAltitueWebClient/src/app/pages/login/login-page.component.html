<div class="login-page">
  <div class="login-card surface-card">
    <h1>Welcome Back</h1>
    <p class="muted subtitle">Sign in to continue your learning journey.</p>

    <form class="login-form" (submit)="onLogin($event)">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="mithun@example.com" [(ngModel)]="email" name="email" />

      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Enter your password" [(ngModel)]="password" name="password" />

      @if (errorMessage) {
        <p class="error-message">{{ errorMessage }}</p>
      }

      <button type="submit" class="primary-btn">Login</button>
    </form>

    <div class="auth-divider">
      <span>or</span>
    </div>

    <div class="google-login">
      <div #googleButtonContainer class="google-button-container"></div>

      @if (!isGoogleConfigured()) {
        <button type="button" class="google-fallback-btn" (click)="onGoogleFallbackClick($event)" disabled>
          Continue with Google
        </button>
      }

      @if (googleError()) {
        <p class="muted google-hint">{{ googleError() }}</p>
      }
    </div>

    <div class="actions-row">
      <a routerLink="/" class="back-link">Back to Home</a>
      <a href="#" (click)="$event.preventDefault()" class="muted">Forgot password?</a>
    </div>

    <div class="register-prompt">
      <p class="muted">
        Don't have an account?
        <a routerLink="/register" class="link">Sign up here</a>
      </p>
    </div>
  </div>
</div>
