<article class="surface-card stat-card">
  <h3 class="section-title">{{ title }}</h3>

  @if (progressPercent !== undefined) {
    <div class="progress-bar" role="progressbar" [attr.aria-valuenow]="progressPercent" aria-valuemin="0" aria-valuemax="100">
      <div class="fill" [style.width.%]="progressPercent"></div>
    </div>
    <p class="muted">{{ progressLabel }}</p>
  } @else {
    <p class="big-number">{{ value }}</p>
  }
</article>
